name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Once on SQLite (what local runs use) and once on Postgres (what
    # production runs, journal 48). Postgres enforces foreign keys and types
    # that SQLite lets slide.
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: spotify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Config is required at import time, but the test suite never talks
      # to the real Spotify API (isolated DB + mocked responses — see
      # journal entry 11), so a placeholder value is fine here.
      SPOTIFY_CLIENT_ID: ci-placeholder
      JWT_SIGNING_KEY: ci-placeholder-signing-key-at-least-32-bytes
      TOKEN_ENCRYPTION_KEY: za0EN7YSS5tpCSlt6Yc7VzPJlboleuYfK6ndNxEvNAU=
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:ci@localhost:5432/spotify_test' || '' }}
        run: uv run pytest --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  docker:
    # Catches a broken Dockerfile before it reaches Render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t spotify-mcp:ci .
