repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Runs through the project's own venv (language: system) instead of
        # pre-commit's isolated mypy env, so it sees the same installed
        # library types (fastapi, sqlmodel, pydantic, ...) as CI does —
        # avoids duplicating that dependency list via additional_dependencies.
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
