[project]
name = "spotify-mcp"
version = "0.1.0"
description = "An MCP server for the Spotify Web API, built with Python and FastAPI"
authors = [
    { name = "Pacolias", email = "pacomolinac2003@gmail.com" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.44",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
spotify-mcp = "spotify_mcp.cli:cli"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
