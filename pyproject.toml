[project]
name = "spotify-mcp"
version = "0.1.0"
description = "An MCP server for the Spotify Web API, built with Python and FastAPI"
authors = [
    { name = "Pacolias", email = "pacomolinac2003@gmail.com" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.44",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
spotify-mcp = "spotify_mcp.cli:cli"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/spotify_mcp"]
# cli.py is the login/serve entrypoint: exercised via subprocess and by
# hand against real Spotify, not unit-tested — see journal entry 11.
omit = ["src/spotify_mcp/cli.py"]

[tool.coverage.report]
fail_under = 78

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prose prompt text reads worse wrapped mid-sentence than left a few chars
# over the limit.
"src/spotify_mcp/mcp/prompts.py" = ["E501"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]
